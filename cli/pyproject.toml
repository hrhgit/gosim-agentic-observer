[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "survey26"
version = "1.6.0"
description = "Official command-line tool of the GOSIM 2026 Agentic Observer Hackathon"
readme = "AGENTS.md"
requires-python = ">=3.9"
license = { text = "CC-BY-NC-4.0" }
dependencies = []

[project.urls]
Homepage = "https://create.gosim.org/survey26/platform/cli"
Source = "https://github.com/gosimfoundation/hackathon-survey26/tree/main/cli"

[project.scripts]
survey26 = "survey26:_entry"

[tool.setuptools]
py-modules = ["survey26"]
