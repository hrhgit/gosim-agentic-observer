services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SAC_DATA_DIR: /srv/app/data
      SAC_DATABASE_URL: sqlite:////srv/app/data/app.db
    volumes:
      - ./data:/srv/app/data
    ports:
      - "127.0.0.1:8000:8000"
  # Optional TLS front. Put your domain in Caddyfile and open ports 80/443.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web
volumes:
  caddy_data:
