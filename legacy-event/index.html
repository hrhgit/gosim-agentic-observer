<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>巡天智能体 · Agent Observer</title>
    <meta name="description" content="面向智能巡天的 GOSIM 黑客松：构建观测智能体，读取天空状态，并在每 900 秒选择下一次观测。" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      try {
        const redirect = window.sessionStorage.getItem('gosim-pages-redirect')
        const eventBase = '%BASE_URL%'
        if (redirect) {
          const target = new URL(redirect, window.location.origin)
          if (target.origin === window.location.origin && target.pathname.startsWith(eventBase)) {
            window.sessionStorage.removeItem('gosim-pages-redirect')
            window.history.replaceState(null, '', target.pathname + target.search + target.hash)
          }
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
