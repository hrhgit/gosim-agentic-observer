[package]
name = "rust-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rust-agent"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"  # getrusage: our own CPU time (see src/clock.rs)
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[profile.release]
opt-level = 2
